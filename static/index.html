<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Crop · watermark et compression vidéo en masse</title>
<meta name="description" content="Elite Crop enlève un watermark en bas à droite et compresse vos vidéos trop lourdes, photos et vidéos en masse.">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root {
    --night: #07192E;
    --ink: #0A2540;
    --accent: #378ADD;
    --green: #5DCAA5;
    --red: #E5484D;
    --text: #EAF2FA;
    --muted: #8FA9C4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px; }

  .topbar { display: flex; justify-content: flex-end; }
  .lang { display: inline-flex; border: 1px solid rgba(55,138,221,.4); border-radius: 8px; overflow: hidden; }
  .lang button {
    border: none; border-radius: 0; border-right: 1px solid rgba(55,138,221,.25);
    padding: 5px 12px; font-size: 12.5px; color: var(--muted); background: transparent;
  }
  .lang button:last-child { border-right: none; }
  .lang button.on { background: var(--accent); color: #fff; font-weight: 600; }

  header { text-align: center; padding: 8px 0 22px; }
  h1 { font-size: 34px; letter-spacing: -1px; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .tagline b { color: var(--text); font-weight: 600; }

  .feats { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .feat {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--ink); border: 1px solid rgba(55,138,221,.28);
    border-radius: 999px; padding: 7px 15px; font-size: 13.5px; color: var(--text);
  }
  .feat-new { border-color: var(--green); }
  .feat-new .tag {
    background: var(--green); color: #04241a; font-weight: 700; font-size: 11px;
    letter-spacing: .3px; padding: 2px 8px; border-radius: 999px; text-transform: uppercase;
  }

  #drop {
    border: 2px dashed rgba(55,138,221,.5);
    border-radius: 16px;
    background: var(--ink);
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--green); background: #0d2f52; }
  #drop .big { font-size: 17px; font-weight: 600; }
  #drop .small { color: var(--muted); font-size: 13.5px; margin-top: 6px; }

  #workbench { display: none; margin-top: 20px; }

  .canvasbox { text-align: center; }
  #preview { background: var(--ink); border-radius: 12px; max-width: 100%; }
  .nav { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .nav .name { flex: 1; text-align: center; color: var(--muted); font-size: 13px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  button {
    background: var(--ink);
    color: var(--text);
    border: 1px solid rgba(55,138,221,.4);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }

  .slider-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .slider-row label { width: 130px; font-size: 14.5px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .slider-row .val { width: 130px; color: var(--green); font-weight: 600; font-size: 14px; }

  .comp-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .comp-row > label { width: 130px; font-size: 14.5px; }
  .seg { display: inline-flex; border: 1px solid rgba(55,138,221,.4); border-radius: 10px; overflow: hidden; }
  .seg button {
    border: none; border-radius: 0; border-right: 1px solid rgba(55,138,221,.25);
    padding: 8px 14px; font-size: 13.5px; color: var(--muted); background: transparent;
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .comp-hint { flex-basis: 100%; margin-left: 142px; color: var(--muted); font-size: 12.5px; }

  #go {
    display: block;
    width: 100%;
    margin-top: 20px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(55,138,221,.35);
  }
  #go:hover:not(:disabled) { filter: brightness(1.08); }

  #filelist { list-style: none; margin-top: 16px; }
  #filelist li {
    display: flex; align-items: center; gap: 10px;
    background: var(--ink);
    border-radius: 8px;
    padding: 7px 12px;
    margin-bottom: 6px;
    font-size: 13.5px;
  }
  #filelist .st { width: 22px; text-align: center; }
  #filelist .fn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #filelist .info { color: var(--muted); font-size: 12px; }

  #summary { margin-top: 14px; text-align: center; font-size: 15px; color: var(--green); font-weight: 600; }

  .dl {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 14px; text-decoration: none;
    background: var(--ink); border: 1px solid rgba(93,202,165,.45);
    border-radius: 12px; padding: 12px 18px; transition: border-color .15s, background .15s;
  }
  .dl:hover { border-color: var(--green); background: #0d2f52; }
  .dl .ic { font-size: 20px; }
  .dl .t { color: var(--text); font-size: 14.5px; font-weight: 600; }
  .dl .s { color: var(--muted); font-size: 12.5px; }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 26px 0 10px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="lang" id="lang">
      <button data-lang="fr">FR</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <header>
    <h1>✂️ Elite <span>Crop</span></h1>
    <p class="tagline" id="tagline"></p>
    <div class="feats">
      <span class="feat" id="featWatermark"></span>
      <span class="feat feat-new" id="featCompress"></span>
      <span class="feat" id="featBulk"></span>
    </div>
  </header>

  <div id="drop">
    <div class="big" id="dropBig"></div>
    <div class="small" id="dropSmall"></div>
    <input type="file" id="picker" multiple hidden
           accept=".jpg,.jpeg,.png,.webp,.bmp,.mp4,.mov,.m4v,.avi,.mkv,.webm,.mpg,.mpeg,.wmv">
  </div>

  <a class="dl" id="dl" href="https://github.com/Vanillia75/elite-crop/releases/latest/download/Elite-Crop.zip">
    <span class="ic">💻</span>
    <span>
      <span class="t" id="dlTitle"></span><br>
      <span class="s" id="dlSub"></span>
    </span>
  </a>

  <div id="workbench">
    <div class="canvasbox">
      <canvas id="preview" width="840" height="470"></canvas>
      <div class="nav">
        <button id="prev"></button>
        <span class="name" id="navname"></span>
        <button id="next"></button>
      </div>
    </div>

    <div class="slider-row">
      <label id="labelBottom"></label>
      <input type="range" id="pctBottom" min="0" max="40" step="0.5" value="8">
      <span class="val" id="valBottom"></span>
    </div>
    <div class="slider-row">
      <label id="labelRight"></label>
      <input type="range" id="pctRight" min="0" max="40" step="0.5" value="0">
      <span class="val" id="valRight"></span>
    </div>

    <div class="comp-row">
      <label id="labelCompress"></label>
      <div class="seg" id="seg">
        <button data-lvl="none" class="on"></button>
        <button data-lvl="light"></button>
        <button data-lvl="medium"></button>
        <button data-lvl="strong"></button>
        <button data-lvl="extreme"></button>
      </div>
      <span class="comp-hint" id="compHint"></span>
    </div>

    <button id="go"></button>
    <div id="summary"></div>
    <ul id="filelist"></ul>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const PHOTO_EXTS = ["jpg","jpeg","png","webp","bmp"];
const VIDEO_EXTS = ["mp4","mov","m4v","avi","mkv","webm","mpg","mpeg","wmv"];

const state = { files: [], index: 0, bitmap: null, busy: false, compress: "none" };

const $ = id => document.getElementById(id);
const drop = $("drop"), picker = $("picker"), bench = $("workbench");
const canvas = $("preview"), ctx = canvas.getContext("2d");
const sliderB = $("pctBottom"), sliderR = $("pctRight");

// ------------------------------------------------------------------ langues

const I18N = {
  fr: {
    title: "Elite Crop · watermark et compression vidéo en masse",
    metaDesc: "Elite Crop enlève un watermark en bas à droite et compresse vos vidéos trop lourdes, photos et vidéos en masse.",
    taglineHTML: "Enlève le watermark en bas à droite <b>et compresse tes vidéos trop lourdes</b>. Photos et vidéos, en masse. Les originaux ne sont jamais modifiés.",
    featWatermark: "🎯 Watermark en bas à droite",
    featCompressHTML: "🗜️ Compression vidéo <span class=\"tag\">Nouveau</span>",
    featBulk: "⚡ En masse",
    dropBig: "Glisse tes photos et vidéos ici",
    dropSmall: "ou clique pour choisir · JPG, PNG, WebP, BMP · MP4, MOV, MKV, AVI, WebM",
    dlTitle: "Télécharger l'appli Windows",
    dlSub: "hors ligne, encore plus rapide pour les grosses vidéos",
    navPrev: "◀ Précédent",
    navNext: "Suivant ▶",
    cutBottom: "Couper en bas",
    cutRight: "Couper à droite",
    compressLabel: "Compresser",
    mode_none: "Qualité max",
    mode_light: "Légère",
    mode_medium: "Moyenne",
    mode_strong: "Forte",
    mode_extreme: "Extrême",

    footer: "Elite Crop · outil interne · rogne le watermark ou compresse, au choix",
    hint_none: "Aucune compression : le fichier garde son poids d'origine.",
    hint_light: "Allège un peu, qualité intacte, résolution conservée.",
    hint_medium: "Bon équilibre : réduit nettement le poids, qualité quasi identique (max 1080p).",
    hint_strong: "Fichiers légers, pour envoyer vite (max 720p).",
    hint_extreme: "Compression maximale : fichiers minuscules, qualité réduite (max 540p).",
    estPrefix: " · Estimation : ",
    estSuffix: " (le poids réel s'affiche après traitement).",
    stUpload: "envoi {p} %",
    stProcess: "traitement {p} %",
    stDownload: "téléchargement…",
    stPrepare: "préparation…",
    stCrop: "recadrage…",
    stFileN: "Fichier {n} / {total}…",
    stZip: "Préparation du zip…",
    stDoneOk: "✅ Terminé ! {n} fichier(s) téléchargé(s).",
    stDoneErr: "Terminé : {ok} réussi(s), {err} erreur(s).",
    errServer: "erreur serveur ({code})",
    errConn: "connexion perdue pendant l'envoi",
    errTrack: "suivi du traitement impossible",
    errProcess: "échec du traitement",
    errResult: "téléchargement du résultat impossible",
    errCropPhoto: "échec du recadrage",
    previewFail: "Aperçu impossible pour ce fichier (il sera quand même traité).",
    alertNothing: "Rien à faire : aucun rognage et aucune compression.\n\nMonte un curseur pour couper le watermark, ou choisis un mode de compression pour exporter des fichiers plus légers sans rogner.",
    zipName: "Sans-watermark.zip",
    unitG: "Go", unitM: "Mo", unitK: "Ko", dot: ",",
  },
  en: {
    title: "Elite Crop · watermark removal and video compression in bulk",
    metaDesc: "Elite Crop removes a bottom-right watermark and compresses your oversized videos, photos and videos in bulk.",
    taglineHTML: "Removes the bottom-right watermark <b>and compresses your oversized videos</b>. Photos and videos, in bulk. Originals are never modified.",
    featWatermark: "🎯 Bottom-right watermark",
    featCompressHTML: "🗜️ Video compression <span class=\"tag\">New</span>",
    featBulk: "⚡ In bulk",
    dropBig: "Drop your photos and videos here",
    dropSmall: "or click to choose · JPG, PNG, WebP, BMP · MP4, MOV, MKV, AVI, WebM",
    dlTitle: "Download the Windows app",
    dlSub: "offline, even faster for large videos",
    navPrev: "◀ Previous",
    navNext: "Next ▶",
    cutBottom: "Cut bottom",
    cutRight: "Cut right",
    compressLabel: "Compress",
    mode_none: "Max quality",
    mode_light: "Light",
    mode_medium: "Medium",
    mode_strong: "Strong",
    mode_extreme: "Extreme",
    goBtn: "⚡ Process all",
    footer: "Elite Crop · internal tool · crop the watermark or compress, your choice",
    hint_none: "No compression: the file keeps its original size.",
    hint_light: "Lightens a bit, quality intact, resolution kept.",
    hint_medium: "Good balance: clearly smaller, near-identical quality (max 1080p).",
    hint_strong: "Light files, to send fast (max 720p).",
    hint_extreme: "Maximum compression: tiny files, reduced quality (max 540p).",
    estPrefix: " · Estimate: ",
    estSuffix: " (actual size shown after processing).",
    stUpload: "upload {p}%",
    stProcess: "processing {p}%",
    stDownload: "downloading…",
    stPrepare: "preparing…",
    stCrop: "cropping…",
    stFileN: "File {n} / {total}…",
    stZip: "Preparing the zip…",
    stDoneOk: "✅ Done! {n} file(s) downloaded.",
    stDoneErr: "Done: {ok} succeeded, {err} error(s).",
    errServer: "server error ({code})",
    errConn: "connection lost during upload",
    errTrack: "cannot track processing",
    errProcess: "processing failed",
    errResult: "cannot download the result",
    errCropPhoto: "cropping failed",
    previewFail: "Preview unavailable for this file (it will still be processed).",
    alertNothing: "Nothing to do: no cropping and no compression.\n\nMove a slider to cut the watermark, or pick a compression mode to export lighter files without cropping.",
    zipName: "No-watermark.zip",
    unitG: "GB", unitM: "MB", unitK: "KB", dot: ".",
  },
};

let LANG = "fr";
try {
  const saved = localStorage.getItem("elitecrop_lang");
  if (saved === "fr" || saved === "en") LANG = saved;
  else LANG = /^fr/i.test(navigator.language || "") ? "fr" : "en";
} catch { LANG = /^fr/i.test(navigator.language || "") ? "fr" : "en"; }

function t(key, p) {
  let s = (I18N[LANG] && I18N[LANG][key]) != null ? I18N[LANG][key] : (I18N.fr[key] || key);
  if (p) for (const k in p) s = s.split("{" + k + "}").join(p[k]);
  return s;
}

function applyLang(lang) {
  LANG = lang === "en" ? "en" : "fr";
  try { localStorage.setItem("elitecrop_lang", LANG); } catch {}
  document.documentElement.lang = LANG;
  document.title = t("title");
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", t("metaDesc"));
  $("tagline").innerHTML = t("taglineHTML");
  $("featWatermark").textContent = t("featWatermark");
  $("featCompress").innerHTML = t("featCompressHTML");
  $("featBulk").textContent = t("featBulk");
  $("dropBig").textContent = t("dropBig");
  $("dropSmall").textContent = t("dropSmall");
  $("dlTitle").textContent = t("dlTitle");
  $("dlSub").textContent = t("dlSub");
  $("prev").textContent = t("navPrev");
  $("next").textContent = t("navNext");
  $("labelBottom").textContent = t("cutBottom");
  $("labelRight").textContent = t("cutRight");
  $("labelCompress").textContent = t("compressLabel");
  document.querySelectorAll("#seg button").forEach(b => { b.textContent = t("mode_" + b.dataset.lvl); });
  $("go").textContent = t("goBtn");
  $("footer").textContent = t("footer");
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  updateValueLabels();
  updateCompHint();
  if (state.files.length) { refreshList(); refreshPreview(); }
}

$("lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (b) applyLang(b.dataset.lang);
});

function extOf(name) { return name.split(".").pop().toLowerCase(); }
function isPhoto(f) { return PHOTO_EXTS.includes(extOf(f.name)); }
function isVideo(f) { return VIDEO_EXTS.includes(extOf(f.name)); }

function fmtSize(bytes) {
  const d = t("dot");
  const fmt = (n, dec) => n.toFixed(dec).replace(".", d);
  const mo = bytes / 1024 / 1024;
  if (mo >= 1024) return fmt(mo / 1024, mo >= 10240 ? 0 : 1) + " " + t("unitG");
  if (mo >= 1) return fmt(mo, 1) + " " + t("unitM");
  return Math.max(1, Math.round(bytes / 1024)) + " " + t("unitK");
}

// ------------------------------------------------------ choix de compression
// lo/hi = fourchette typique du poids de sortie (fraction du poids d'origine).

const COMP_MODES = {
  none:    { lo: 1,    hi: 1 },
  light:   { lo: 0.45, hi: 0.75 },
  medium:  { lo: 0.20, hi: 0.45 },
  strong:  { lo: 0.08, hi: 0.22 },
  extreme: { lo: 0.03, hi: 0.10 },
};

function updateCompHint() {
  const m = COMP_MODES[state.compress];
  let txt = t("hint_" + state.compress);
  const total = state.files.filter(e => isVideo(e.file))
                           .reduce((s, e) => s + e.file.size, 0);
  if (state.compress !== "none" && total > 0) {
    txt += t("estPrefix") + fmtSize(total) + " → " +
           fmtSize(total * m.lo) + "–" + fmtSize(total * m.hi) + t("estSuffix");
  }
  $("compHint").textContent = txt;
}

$("seg").addEventListener("click", e => {
  const btn = e.target.closest("button[data-lvl]");
  if (!btn) return;
  state.compress = btn.dataset.lvl;
  [...$("seg").children].forEach(b => b.classList.toggle("on", b === btn));
  updateCompHint();
});

// ------------------------------------------------------------ ajout fichiers

drop.addEventListener("click", () => picker.click());
picker.addEventListener("change", () => addFiles(picker.files));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("over");
  addFiles(e.dataTransfer.files);
});

function addFiles(list) {
  let added = 0;
  for (const f of list) {
    if ((isPhoto(f) || isVideo(f)) &&
        !state.files.some(x => x.file.name === f.name && x.file.size === f.size)) {
      state.files.push({ file: f, status: "attente", info: "" });
      added++;
    }
  }
  if (added) {
    state.index = state.files.length - added;
    bench.style.display = "block";
    refreshList();
    refreshPreview();
    updateCompHint();
  }
}

// ----------------------------------------------------------------- aperçu

$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
function step(d) {
  if (!state.files.length) return;
  state.index = (state.index + d + state.files.length) % state.files.length;
  refreshPreview();
}

function photoBitmap(file) {
  return createImageBitmap(file, { imageOrientation: "from-image" });
}

function videoFrame(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    v.preload = "auto";
    v.muted = true;
    v.src = URL.createObjectURL(file);
    v.addEventListener("loadeddata", () => {
      v.currentTime = Math.min(1, (v.duration || 0) / 2);
    }, { once: true });
    v.addEventListener("seeked", () => {
      const c = document.createElement("canvas");
      c.width = v.videoWidth;
      c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      URL.revokeObjectURL(v.src);
      resolve(c);
    }, { once: true });
    v.addEventListener("error", () => reject(new Error("preview")), { once: true });
  });
}

async function refreshPreview() {
  const entry = state.files[state.index];
  if (!entry) return;
  $("navname").textContent = (state.index + 1) + " / " + state.files.length + " — " + entry.file.name;
  state.bitmap = null;
  try {
    state.bitmap = isPhoto(entry.file) ? await photoBitmap(entry.file)
                                       : await videoFrame(entry.file);
  } catch {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#E5484D";
    ctx.font = "15px Segoe UI";
    ctx.textAlign = "center";
    ctx.fillText(t("previewFail"), canvas.width / 2, canvas.height / 2);
  }
  drawOverlay();
}

function drawOverlay() {
  updateValueLabels();
  const bm = state.bitmap;
  if (!bm) return;
  const scale = Math.min(canvas.width / bm.width, canvas.height / bm.height);
  const dw = bm.width * scale, dh = bm.height * scale;
  const x0 = (canvas.width - dw) / 2, y0 = (canvas.height - dh) / 2;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bm, x0, y0, dw, dh);

  const cutB = dh * sliderB.value / 100;
  const cutR = dw * sliderR.value / 100;
  ctx.fillStyle = "rgba(229, 72, 77, .55)";
  if (cutB > 0) ctx.fillRect(x0, y0 + dh - cutB, dw, cutB);
  if (cutR > 0) ctx.fillRect(x0 + dw - cutR, y0, cutR, dh - cutB);
  ctx.strokeStyle = "#5DCAA5";
  ctx.lineWidth = 2;
  ctx.strokeRect(x0, y0, dw - cutR, dh - cutB);
}

function updateValueLabels() {
  const bm = state.bitmap;
  $("valBottom").textContent = (+sliderB.value).toFixed(1) + " %" +
    (bm ? " (" + Math.round(bm.height * sliderB.value / 100) + " px)" : "");
  $("valRight").textContent = (+sliderR.value).toFixed(1) + " %" +
    (bm ? " (" + Math.round(bm.width * sliderR.value / 100) + " px)" : "");
}

sliderB.addEventListener("input", drawOverlay);
sliderR.addEventListener("input", drawOverlay);

// ------------------------------------------------------------ liste + états

function refreshList() {
  const icons = { attente: "•", encours: "⏳", ok: "✅", erreur: "❌" };
  $("filelist").innerHTML = state.files.map(e => {
    const pct = e.status === "ok" ? 100 : (e.pct || 0);
    const bg = 'background:linear-gradient(90deg, rgba(55,138,221,.35) ' +
               pct + '%, var(--ink) ' + pct + '%);';
    const info = typeof e.info === "function" ? e.info() : (e.info || "");
    return '<li style="' + bg + '"><span class="st">' + icons[e.status] + '</span>' +
      '<span class="fn">' + e.file.name + '</span>' +
      '<span class="info">' + info + '</span></li>';
  }).join("");
}

// -------------------------------------------------------------- traitement

function croppedSize(w, h) {
  return {
    w: Math.max(16, w - Math.round(w * sliderR.value / 100)),
    h: Math.max(16, h - Math.round(h * sliderB.value / 100)),
  };
}

async function cropPhotoLocally(file) {
  const bm = await photoBitmap(file);
  const { w, h } = croppedSize(bm.width, bm.height);
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  c.getContext("2d").drawImage(bm, 0, 0, w, h, 0, 0, w, h);
  const ext = extOf(file.name);
  const mime = ext === "png" ? "image/png" : ext === "webp" ? "image/webp" : "image/jpeg";
  const blob = await new Promise(res => c.toBlob(res, mime, 0.95));
  if (!blob) throw new Error(t("errCropPhoto"));
  const name = ext === "bmp" ? file.name.replace(/\.bmp$/i, ".jpg") : file.name;
  return { name, blob };
}

function uploadWithProgress(url, fd, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", url);
    x.upload.onprogress = e => {
      if (e.lengthComputable) onProgress(e.loaded / e.total * 100);
    };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) {
        resolve(JSON.parse(x.responseText));
      } else {
        let msg = t("errServer", { code: x.status });
        try { msg = JSON.parse(x.responseText).detail || msg; } catch {}
        reject(new Error(msg));
      }
    };
    x.onerror = () => reject(new Error(t("errConn")));
    x.send(fd);
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// La barre de la ligne : envoi = 0→40 %, traitement = 40→95 %, fin = 100 %.
async function cropVideoOnServer(file, entry) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("bottom", sliderB.value);
  fd.append("right", sliderR.value);
  fd.append("compress", state.compress);

  const { job } = await uploadWithProgress("/api/process", fd, p => {
    const pr = Math.round(p);
    entry.info = () => t("stUpload", { p: pr });
    entry.pct = p * 0.4;
    refreshList();
  });

  for (;;) {
    await sleep(800);
    const res = await fetch("/api/progress/" + job);
    if (!res.ok) throw new Error(t("errTrack"));
    const st = await res.json();
    if (st.status === "error") throw new Error(st.error || t("errProcess"));
    const pr = Math.round(st.progress);
    entry.info = () => t("stProcess", { p: pr });
    entry.pct = 40 + st.progress * 0.55;
    refreshList();
    if (st.status === "done") break;
  }

  entry.info = () => t("stDownload");
  entry.pct = 97;
  refreshList();
  const res = await fetch("/api/result/" + job);
  if (!res.ok) throw new Error(t("errResult"));
  return { name: file.name, blob: await res.blob() };
}

$("go").addEventListener("click", async () => {
  if (state.busy || !state.files.length) return;
  if (+sliderB.value === 0 && +sliderR.value === 0 && state.compress === "none") {
    alert(t("alertNothing"));
    return;
  }
  state.busy = true;
  $("go").disabled = true;
  $("summary").textContent = "";

  const zip = new JSZip();
  const results = [];
  let n = 0;
  for (const entry of state.files) {
    n++;
    $("summary").textContent = t("stFileN", { n: n, total: state.files.length });
    entry.status = "encours";
    entry.pct = 0;
    entry.info = isVideo(entry.file) ? () => t("stPrepare") : () => t("stCrop");
    refreshList();
    try {
      const r = isPhoto(entry.file) ? await cropPhotoLocally(entry.file)
                                    : await cropVideoOnServer(entry.file, entry);
      results.push(r);
      entry.status = "ok";
      if (isVideo(entry.file)) {
        const before = entry.file.size, after = r.blob.size;
        entry.info = () => fmtSize(before) + " → " + fmtSize(after);
      } else {
        entry.info = "";
      }
    } catch (err) {
      entry.status = "erreur";
      entry.pct = 0;
      const msg = err.message;
      entry.info = () => msg;
    }
    refreshList();
  }

  if (results.length === 1) {
    download(results[0].blob, results[0].name);
  } else if (results.length > 1) {
    $("summary").textContent = t("stZip");
    results.forEach(r => zip.file(r.name, r.blob));
    download(await zip.generateAsync({ type: "blob" }), t("zipName"));
  }

  const errors = state.files.filter(e => e.status === "erreur").length;
  $("summary").textContent = errors
    ? t("stDoneErr", { ok: results.length, err: errors })
    : t("stDoneOk", { n: results.length });
  state.busy = false;
  $("go").disabled = false;
});

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

applyLang(LANG);

// ------------------------------------ rechargement auto quand une MAJ sort
// Vérifie la version toutes les 60 s. Si elle a changé, on recharge la page
// tout seul — mais seulement au repos (aucun fichier en cours) pour ne rien
// interrompre ni perdre.
let appVersion = null;
async function checkVersion() {
  try {
    const r = await fetch("/api/version", { cache: "no-store" });
    const v = (await r.json()).version;
    if (appVersion === null) { appVersion = v; return; }
    if (v !== appVersion && !state.busy && state.files.length === 0) {
      location.reload();
    }
  } catch {}
}
setInterval(checkVersion, 60000);
checkVersion();
